name: Update NR Crew data

on:
  schedule:
    - cron: "30 11 * * *"   # daily 11:30 UTC (7:30 AM EDT)
  workflow_dispatch:         # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests
      - run: python fetch_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

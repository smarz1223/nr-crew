<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NR Crew Fantasy Football</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --page:#D6D9DE; --shell:#F2F3F5; --shell2:#E3E6EA; --rule:#B7BCC4;
  --chrome:#3A3F49; --dim:#5B616C; --ink:#14161A;
  --band:#0D0E12; --band-rule:#2A2E37; --band-ink:#F2F3F5; --band-dim:#9AA0AA;
  --signal:#D4101A; --ember:#FF5A1F;
  --good:#2F8A5C; --bad:#B8433C;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  background:linear-gradient(180deg,#E2E4E8 0,var(--page) 420px)}
a{color:var(--chrome)}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{background:radial-gradient(900px 300px at 85% -80px,rgba(227,18,27,.22),transparent 70%),var(--band);color:var(--band-ink);border-bottom:3px solid var(--signal)}
.brand{display:flex;align-items:center;gap:16px;padding:18px 0 10px}
.brand img{width:68px;height:68px;filter:drop-shadow(0 0 14px rgba(227,18,27,.35))}
.brand h1{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;margin:0;letter-spacing:.5px}
.brand .sub{color:var(--band-dim);font-size:15px;margin-top:4px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--band-ink);
  border:1px solid var(--band-rule);border-radius:20px;padding:5px 12px;cursor:help;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.status.warn i{background:#E0A43A}.status.fail i{background:var(--signal)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--band-dim);font-family:var(--display);font-weight:800;font-size:20px;
  padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--band-ink)}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--signal)}

main.wrap{padding-top:28px;padding-bottom:60px}
section.page{display:none}section.page.on{display:block}
h2{font-family:var(--display);font-weight:800;font-size:32px;margin:0 0 4px;line-height:1}
h3{font-family:var(--display);font-weight:800;font-size:24px;margin:36px 0 10px;line-height:1}
.lede{color:var(--dim);margin:0 0 18px;max-width:70ch}
.note{color:var(--dim);font-size:14px;margin-top:10px;max-width:80ch}

/* chips / pickers */
.picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.picker button{font-family:var(--body);font-weight:600;font-size:15px;color:var(--ink);background:var(--shell);
  border:1px solid var(--rule);border-radius:4px;padding:6px 11px;cursor:pointer;min-height:36px}
.picker button:hover{border-color:var(--dim)}
.picker button[aria-pressed=true]{background:var(--signal);border-color:var(--signal);color:#fff}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--shell)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:13px;border-bottom:1px solid var(--rule);background:var(--shell2);position:sticky;top:0}
td{border-bottom:1px solid rgba(183,188,196,.55)}
.tbl,.panel,.line-card,.mu{box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
td.team{font-weight:700;color:var(--ink)}
tr.cut td{border-bottom:2px solid var(--signal)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:1px}
.tag.bye{background:var(--ink);color:#fff}
.tag.po{border:1px solid var(--chrome);color:var(--chrome)}
.W{color:#1E7A4C;font-weight:700}.L{color:#B3261E;font-weight:700}.T{color:#9A6400;font-weight:700}
.muted{color:var(--dim)}

/* Weekly median chart */
.line-card{background:var(--shell);border:1px solid var(--rule);border-radius:8px;padding:20px 22px 16px;position:relative}
.line-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:14px}
.line-head .big{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--ink)}
.line-head .big small{font-size:18px;color:var(--dim);font-weight:600;margin-left:6px}
.bars{position:relative}
.bar{display:grid;grid-template-columns:118px 1fr 70px 64px;align-items:center;gap:10px;height:32px}
.bar .nm{font-weight:700;font-size:15px}
.bar .track{position:relative;height:18px}
.bar .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#C3C7CD,#9AA0AA)}
.bar.above .fill{background:linear-gradient(90deg,#5B616C,#14161A)}
.bar.below .nm,.bar.below .pts{color:var(--dim)}
.bar .pts{font-family:var(--display);font-weight:800;font-size:20px;text-align:right}
.bar .res{font-size:13px;text-align:right}
.median{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--signal);
  box-shadow:0 0 8px 1px rgba(255,90,31,.55),0 0 18px 3px rgba(227,18,27,.25);pointer-events:none}
.median span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--signal);white-space:nowrap}
.line-card .note{margin-top:26px}
.line-split{grid-column:1/-1;height:1px;margin:4px 0;border-top:1px dashed rgba(212,16,26,.55)}

/* grids & cards */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.panel{background:var(--shell);border:1px solid var(--rule);border-radius:6px;padding:16px}
.panel h4{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 8px}
.chart{position:relative;height:420px}
.chart.sm{height:300px}
.matchups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mu{background:var(--shell);border:1px solid var(--rule);border-radius:6px;padding:10px 14px}
.mu .side{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:4px 0}
.mu .side.win .t{color:var(--ink)}.mu .side .t{font-weight:700;color:var(--dim)}
.mu .side .s{font-family:var(--display);font-weight:800;font-size:22px}
.mu .side.win .s{color:var(--ink)}.mu .side:not(.win) .s{color:var(--dim)}
.mu .vm{font-size:12px;min-width:74px;text-align:right}
.kpis{display:flex;flex-wrap:wrap;gap:24px;margin:6px 0 18px}
.kpi b{display:block;font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.kpi span{color:var(--dim);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--ink);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seat{font-size:13px;font-weight:600;padding:5px 8px!important;text-align:center!important;color:#16181D}
.loading{color:var(--dim);padding:40px 0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.asc::after{content:" ▲";font-size:10px;color:var(--signal)}
th.desc::after{content:" ▼";font-size:10px;color:var(--signal)}
td.dv{min-width:150px;vertical-align:middle;text-align:center}
td.dv.lead{text-align:right}
.dvc{position:relative;height:12px;margin-bottom:4px}
.dvc::before{content:"";position:absolute;top:-3px;bottom:-3px;left:calc(50% - 1px);width:2px;background:var(--dim)}
.dvc.lead::before{left:auto;right:0}
.dvbar{position:absolute;top:0;height:12px;border-radius:2px}
.dvbar.pos{left:50%;background:var(--good)}
.dvbar.neg{right:50%;background:var(--bad)}
.dvc.lead .dvbar.neg{right:0}
td.dv small{color:var(--dim);margin-left:5px}
.mv{font-weight:700;white-space:nowrap}
.mv.up{color:#1E7A4C}.mv.dn{color:#B3261E}.mv.fl{color:var(--dim);font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--shell2);color:var(--dim);border:1px solid var(--rule)}
.pill.out{border-color:#C9A0A0;color:#8E3B34}
.board{border:1px solid var(--rule);border-radius:6px;background:var(--shell);overflow-x:auto}
.board table{width:100%;table-layout:fixed;border-collapse:collapse}
.board th{text-align:left;font-size:11px;padding:6px 4px;letter-spacing:.2px}
.board th:first-child,.board td.rd{width:26px}
.board td.bd{text-align:left;padding:4px 5px;border-bottom:1px solid rgba(183,188,196,.55);overflow:hidden}
.board td.bd b{display:block;font-size:11.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board td.bd i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);line-height:1.2}
.board td.rd{text-align:center;color:var(--dim);font-size:12px}
.board{scrollbar-width:thin}
@media (max-width:820px){.board table{min-width:700px}.board td.bd b{font-size:10px}.board td.bd i{font-size:9px}.board th{font-size:9.5px}}
.rules{max-width:1040px}
.rule-sec{background:var(--shell);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;margin:0 0 18px;scroll-margin-top:12px}
.rule-sec h3{margin:0 0 12px;display:flex;align-items:baseline;gap:12px}
.rule-sec h3 .n{font-size:18px;color:#fff;background:var(--signal);border-radius:4px;padding:3px 9px 2px;line-height:1}
.rule-sec h4{font-family:var(--display);font-weight:800;font-size:19px;margin:18px 0 6px}
.rule-sec ul{margin:6px 0 0;padding-left:20px}.rule-sec li{margin:5px 0;max-width:72ch}
.rule-sec li.ex{list-style:none;margin-left:-4px;color:var(--dim);font-size:15px}
.rule-sec p{margin:6px 0;max-width:72ch}
.pool{display:flex;flex-wrap:wrap;gap:28px;margin:4px 0 14px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.slot{font-family:var(--display);font-weight:800;font-size:18px;min-width:52px;text-align:center;padding:8px 10px;border-radius:5px;background:var(--ink);color:#fff}
.slot.flex{background:#5B616C}.slot.sf{background:var(--signal)}
.slot.bench{background:var(--shell2);color:var(--ink);border:1px dashed var(--rule)}
.ladder{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:10px 0 4px}
.rung{background:var(--shell2);border:1px solid var(--rule);border-radius:5px;padding:8px 12px;min-width:120px}
.rung b{display:block;font-family:var(--display);font-weight:900;font-size:26px;line-height:1.05}
.rung span{font-size:13px;color:var(--dim)}
.rung.no{background:transparent;border-style:dashed}.rung.no b{color:var(--signal)}
.arrow{align-self:center;color:var(--dim);font-size:20px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
.two .tbl table{font-size:14px}
footer{border-top:1px solid var(--rule);color:var(--dim);font-size:14px;padding:18px 0 30px}

@media (max-width:640px){
  .brand h1{font-size:32px}.brand img{width:54px;height:54px}
  .status span{display:none}
  .bar{grid-template-columns:86px 1fr 58px 44px;gap:6px}
  .bar .nm{font-size:13px}.bar .pts{font-size:17px}
  .line-head .big{font-size:34px}
  .chart{height:380px}
}
@media (prefers-reduced-motion:no-preference){
  .median{animation:glow 2.6s ease-in-out 1}
  @keyframes glow{0%{opacity:0}35%{opacity:1}}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <img src="logo.png" alt="NR Crew logo">
      <div><h1>NR Crew</h1><div class="sub" id="sub">Fantasy football</div></div>
      <div class="status" id="status" title=""><i></i><span id="statusTxt">Loading</span></div>
    </div>
    <nav role="tablist" id="nav"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="loading">Loading league data…</div></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const PAGES=[["standings","Standings"],["weekly","Weekly"],["categories","Stat Categories"],["positions","Positions"],["teams","Teams"],["draft","Draft"],["history","League History"],["rules","Rulebook"]];
const POS=["QB","RB","WR","TE","K","DEF"];
const GROUPS=["Passing","Rushing","Receiving","Misc Offense","Kicking","Defense"];
const SERIES=["#D4101A","#FF7A3D","#3A3F49","#A3A9B3","#E0A43A","#7A0E14"];
let D=null, charts={};
const $=s=>document.querySelector(s);
const f2=x=>(+x).toFixed(2), f1=x=>(+x).toFixed(1);
const f0=x=>Math.round(+x).toLocaleString();
const pct=x=>x>=1?"1.000":(+x).toFixed(3).replace(/^0/,"");
const num=x=>Number.isInteger(+x)?String(+x):(+x).toFixed(1);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function heat(v,lo,hi,invert){
  if(hi===lo||v==null)return"";
  let t=(v-lo)/(hi-lo); if(invert)t=1-t;
  const c=t>=.5?[47,138,92]:[196,64,56], a=Math.abs(t-.5)*2*.5;
  return `background:rgba(${c},${a.toFixed(2)})`;
}
function colHeat(rows,key,invert){const v=rows.map(r=>+r[key]);const lo=Math.min(...v),hi=Math.max(...v);return r=>heat(+r[key],lo,hi,invert)}
function mkChart(id,cfg){if(charts[id])charts[id].destroy();const el=document.getElementById(id);if(!el||!window.Chart)return;charts[id]=new Chart(el,cfg)}
function baseOpts(extra={}){return Object.assign({responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{legend:{labels:{color:"#14161A",font:{family:"Barlow Semi Condensed",size:13}}},tooltip:{mode:"index",intersect:false}},
  scales:{x:{ticks:{color:"#4A505B"},grid:{color:"#C9CDD3"}},y:{ticks:{color:"#14161A"},grid:{color:"#C9CDD3"}}}},extra)}
function picker(id,items,cur,cb){
  return `<div class="picker" id="${id}">${items.map(([v,l])=>`<button aria-pressed="${v==cur}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div>`;
}
function bindPicker(id,cb){document.getElementById(id)?.addEventListener("click",e=>{const b=e.target.closest("button");if(b)cb(b.dataset.v)})}

/* ---------------- sortable tables ---------------- */
function sortVal(td){
  if(!td)return null;
  if(td.dataset.s!=null)return +td.dataset.s;
  const t=td.textContent.trim();
  if(t==="")return null; if(t==="✓")return 1; if(t==="·")return 0;
  const rec=t.match(/^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/);
  if(rec){const w=+rec[1],l=+rec[2],tt=+rec[3],g=w+l+tt;return g?(w+tt/2)/g+g*1e-6:0}
  const c=t.replace(/[,#%+]/g,"");
  if(/^-?\d*\.?\d/.test(c)&&!isNaN(parseFloat(c)))return parseFloat(c);
  return t.toLowerCase();
}
function sortTable(tbl,idx,th){
  const numeric=[...tbl.tBodies].some(tb=>[...tb.rows].some(r=>typeof sortVal(r.cells[idx])=="number"&&!r.classList.contains("pin-bot")));
  const dir=th.classList.contains("desc")?"asc":th.classList.contains("asc")?"desc":(numeric&&idx>0?"desc":"asc");
  tbl.tHead.querySelectorAll("th").forEach(x=>x.classList.remove("asc","desc"));th.classList.add(dir);
  [...tbl.tBodies].forEach(tb=>{
    const rows=[...tb.rows],top=rows.filter(r=>r.classList.contains("pin-top")),bot=rows.filter(r=>r.classList.contains("pin-bot"));
    const body=rows.filter(r=>!top.includes(r)&&!bot.includes(r));
    body.sort((a,b)=>{const x=sortVal(a.cells[idx]),y=sortVal(b.cells[idx]);
      if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
      const c=typeof x=="number"&&typeof y=="number"?x-y:String(x).localeCompare(String(y));return dir=="asc"?c:-c});
    [...top,...body,...bot].forEach(r=>tb.appendChild(r));
  });
  if(tbl.dataset.cut){const rows=[...tbl.tBodies[0].rows];rows.forEach(r=>r.classList.remove("cut"));
    if(idx==0&&dir=="asc")rows[+tbl.dataset.cut-1]?.classList.add("cut");}
}
function makeSortable(){
  document.querySelectorAll("#main table").forEach(tbl=>{
    if(tbl.dataset.sortReady||!tbl.tHead)return;tbl.dataset.sortReady=1;
    [...tbl.tHead.rows[0].cells].forEach((th,i)=>{th.classList.add("sortable");th.tabIndex=0;th.setAttribute("title",(th.title?th.title+". ":"")+"Click to sort");
      const go=()=>sortTable(tbl,i,th);th.addEventListener("click",go);th.addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();go()}})});
  });
}
new MutationObserver(()=>{clearTimeout(window._st);window._st=setTimeout(makeSortable,30)}).observe(document.getElementById("main"),{childList:true,subtree:true});

/* ---------------- boot ---------------- */
fetch("data/nrcrew_data.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{D=d;boot()})
 .catch(e=>{$("#main").innerHTML=`<div class="loading">League data didn't load (${esc(e.message)}). Run the "Update NR Crew data" workflow in GitHub Actions, then refresh.</div>`});

function boot(){
  $("#sub").textContent=`${D.season} season, through week ${D.weeks_entered}`;
  const st={PASS:["","Scores reconciled"],LIVE:["warn","Week in progress"],STALE:["warn","Game log behind"],FAIL:["fail","Data check failed"]}[D.recon_status]||["warn",D.recon_status];
  $("#status").className="status "+st[0];$("#statusTxt").textContent=st[1];
  $("#status").title=D.flags.length?D.flags.join("\n"):"Every team's player points tie back to its weekly scores.";
  const pages=PAGES.filter(([k])=>k!="draft"||D.draft);
  $("#nav").innerHTML=pages.map(([k,l])=>`<button role="tab" data-p="${k}">${l}</button>`).join("");
  $("#main").innerHTML=pages.map(([k])=>`<section class="page" id="p-${k}"></section>`).join("");
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.p)});
  $("#foot").innerHTML=`Updated ${esc(D.updated)}. Player stats are season-to-date from Yahoo team logs, starters only. DST points-allowed fantasy points are backed out of weekly scores because Yahoo's log doesn't list points allowed.<br>Part of <a href="https://redplanetanalytics.com">Red Planet Analytics</a>.`;
  const h=location.hash.slice(1);show(pages.some(p=>p[0]==h)?h:"standings");
}
const rendered={};
function show(p){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.p==p));
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("on",s.id=="p-"+p));
  history.replaceState(null,"","#"+p);
  if(!rendered[p]){rendered[p]=1;({standings:rStandings,weekly:rWeekly,categories:rCategories,positions:rPositions,teams:rTeams,history:rHistory,rules:rRules,draft:rDraft})[p]()}
}
const regWeeks=()=>[...new Set(D.weekly.map(w=>w.week))].sort((a,b)=>a-b);

/* ---------------- Weekly median chart ---------------- */
function theLine(week){
  const rows=D.weekly.filter(w=>w.week==week).sort((a,b)=>b.pf-a.pf);
  if(!rows.length)return"";
  const med=rows[0].median, max=Math.ceil(rows[0].pf/10)*10+10, lo=Math.max(0,Math.floor((rows[rows.length-1].pf-25)/10)*10), x=v=>((v-lo)/(max-lo)*100).toFixed(2)+"%";
  let html=`<div class="line-card"><div class="line-head"><div class="big">${med!=null?f2(med):"Playoffs"}<small>${med!=null?`week ${week} median`:`week ${week}, no median game in playoffs`}</small></div>
   <div class="muted">${med!=null?"Top five scores beat the median for a second win.":""}</div></div><div class="bars">`;
  rows.forEach((r,i)=>{
    const above=med==null||r.pf>med;
    if(med!=null&&i==5)html+=`<div class="line-split"></div>`;
    html+=`<div class="bar ${above?"above":"below"}"><div class="nm">${esc(r.team)}</div>
      <div class="track"><div class="fill" style="width:${x(r.pf)}"></div>${i==0&&med!=null?`<div class="median" style="left:${x(med)}"><span>Median</span></div>`:""}</div>
      <div class="pts">${f2(r.pf)}</div><div class="res"><span class="${r.h2h}">${r.h2h}</span>${r.vs_median?` <span class="${r.vs_median}">${r.vs_median}</span>`:""}</div></div>`;
  });
  return html+`</div><div class="note">Bars start at ${lo} points so close scores are easy to compare. Right column: head-to-head result, then result vs. median.</div></div>`;

let catMode="pts";
function rCategories(){
  const teams=D.standings.map(s=>s.team);

   ${picker("cmpScope",[["ALL","All categories"],...GROUPS.map(g=>[g,g])],"ALL")}${picker("cmpBase",[["avg","vs. league average"],["lead","vs. category leader"]],"avg")}<div class="tbl" id="cmpTbl"></div>
   <h3>Category detail</h3>${picker("grpPick",GROUPS.map(g=>[g,g]),"Passing")}${picker("modePick",[["pts","Fantasy points"],["raw","Raw stats"]],"pts")}<div class="tbl" id="catTbl"></div>
   <p class="note">DST Pts Allowed are the fantasy points earned from the points-allowed tiers (how many points the defense's NFL opponent scored). Yahoo's team log doesn't list the actual points allowed, so the site calculates these fantasy points as each team's weekly scores minus all other player points. That's why this column has fantasy points but no raw stat.</p>`;
  const sorted=[...teams].sort((a,b)=>tot(b)-tot(a));
  function tot(t){return GROUPS.reduce((s,g)=>s+D.categories[g][t].total,0)}
  mkChart("cCat",{type:"bar",data:{labels:sorted,datasets:GROUPS.map((g,i)=>({label:g,data:sorted.map(t=>D.categories[g][t].total),backgroundColor:SERIES[i]}))},
    options:baseOpts({indexAxis:"y",scales:{x:{stacked:true,ticks:{color:"#4A505B"},grid:{color:"#C9CDD3"}},y:{stacked:true,ticks:{color:"#14161A",font:{weight:"600"}},grid:{display:false}}}})});
  let scope="ALL", base="avg";
  const ord=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
  const drawCmp=()=>{
    const keys=scope=="ALL"?GROUPS:Object.keys(D.categories[scope][teams[0]].pts);
    const val=(t,k)=>scope=="ALL"?D.categories[k][t].total:D.categories[scope][t].pts[k];
    const cols=[...keys,"Total"];
    const V=(t,k)=>k=="Total"?keys.reduce((s,kk)=>s+val(t,kk),0):val(t,k);
    const stats=Object.fromEntries(cols.map(k=>{const vs=teams.map(t=>V(t,k));const avg=vs.reduce((a,b)=>a+b,0)/vs.length,mx=Math.max(...vs);
      const b=base=="avg"?avg:mx;const m=Math.max(...vs.map(v=>Math.abs(v-b)))||1;return[k,{b,m,vs}]}));
    const rows=[...teams].sort((a,b)=>V(b,"Total")-V(a,"Total"));
    const cell=(t,k)=>{const s=stats[k],v=V(t,k),d=v-s.b,rank=1+s.vs.filter(x=>x>v+1e-9).length;
      const w=(Math.abs(d)/s.m*(base=="avg"?50:100)).toFixed(1);
      const lab=base=="lead"&&Math.abs(d)<1e-9?"Leader":(d>=0?"+":"")+f2(d);
      return`<td class="dv ${base=="lead"?"lead":""}" data-s="${d.toFixed(4)}" title="${esc(t)}: ${f2(v)} pts, ${ord(rank)} of ${teams.length}"><div class="dvc ${base=="lead"?"lead":""}">${Math.abs(d)>1e-9?`<div class="dvbar ${d>0?"pos":"neg"}" style="width:${w}%"></div>`:""}</div>${lab}<small>#${rank}</small></td>`};
    $("#cmpTbl").innerHTML=`<table><thead><tr><th class="l">Team</th>${cols.map(k=>`<th style="text-align:${base=="avg"?"center":"right"}">${esc(k)}</th>`).join("")}</tr></thead><tbody>

      <tr class="pin-bot"><td class="l muted">${base=="avg"?"League avg":"Leader"}</td>${cols.map(k=>`<td class="muted" style="text-align:${base=="avg"?"center":"right"}">${f2(stats[k].b)}</td>`).join("")}</tr></tbody></table>`;
  };
  drawCmp();
  bindPicker("cmpScope",v=>{scope=v;document.querySelectorAll("#cmpScope button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==v));drawCmp()});
  bindPicker("cmpBase",v=>{base=v;document.querySelectorAll("#cmpBase button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==v));drawCmp()});
  let grp="Passing";
  const draw=()=>{
    const C=D.categories[grp], keys=Object.keys(C[teams[0]].pts).filter(k=>catMode=="pts"||k!="DST Pts Allowed");
    const rows=teams.map(t=>({team:t,total:C[t].total,...Object.fromEntries(keys.map(k=>[k,catMode=="pts"?C[t].pts[k]:C[t].raw[k]]))})).sort((a,b)=>b.total-a.total);
    const hs=Object.fromEntries([...keys,"total"].map(k=>[k,colHeat(rows,k,/INT$|Fumbles|Miss/.test(k)&&catMode=="raw")]));
    $("#catTbl").innerHTML=`<table><thead><tr><th class="l">Team</th>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}<th>${grp} pts</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="team l">${esc(r.team)}</td>${keys.map(k=>`<td style="${hs[k](r)}">${catMode=="pts"?f2(r[k]):f0(r[k])}</td>`).join("")}<td style="${hs.total(r)}"><b>${f2(r.total)}</b></td></tr>`).join("")}</tbody></table>`;
  };
  draw();
  bindPicker("grpPick",g=>{grp=g;document.querySelectorAll("#grpPick button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==g));draw()});
  bindPicker("modePick",m=>{catMode=m;document.querySelectorAll("#modePick button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==m));draw()});
}

        ${DR.summary.map(s=>`<tr><td class="team l">${esc(s.team)}</td><td style="${colHeat(DR.summary,"draft_points")(s)}">${f2(s.draft_points)}</td><td>${f2(s.points_from_adds)}</td>
         <td>${s.hits}</td><td>${s.misses}</td><td>${s.still_rostered}</td><td data-s="${s.avg_value}" style="${colHeat(DR.summary,"avg_value")(s)}">${mv(s.avg_value)}</td></tr>`).join("")}</tbody></table></div>
       <div class="panel" style="margin-top:18px"><h4>Points vs. draft slot</h4><p class="note" style="margin-top:0">Each dot is a pick. Dots high and to the right are late picks that are producing.</p><div class="chart"><canvas id="cScatter"></canvas></div></div>`;
      mkChart("cScatter",{type:"scatter",data:{datasets:POS.map((ps,i)=>({label:ps,
        data:picks.filter(p=>p.pos==ps).map(p=>({x:p.overall,y:p.points,n:p.player})),backgroundColor:SERIES[i],pointRadius:5}))},
        options:baseOpts({plugins:{tooltip:{mode:"point",callbacks:{label:c=>`${c.raw.n}: pick ${c.raw.x}, ${f2(c.raw.y)} pts`}},legend:{labels:{color:"#14161A"}}},
          scales:{x:{title:{display:true,text:"Overall draft pick",color:"#4A505B"},ticks:{color:"#4A505B"},grid:{color:"#C9CDD3"}},
                  y:{title:{display:true,text:"Points",color:"#4A505B"},ticks:{color:"#4A505B"},grid:{color:"#C9CDD3"}}}})});
    } else if(view=="pos"){
      const rows=picks.filter(p=>p.pos==pos).sort((a,b)=>a.pos_draft_rank-b.pos_draft_rank);
      B.innerHTML=`${picker("drPos",POS.map(p=>[p,p]),pos)}
       <p class="lede">${rows.length} ${pos}s drafted. "${pos}1 → ${pos}4" means he was the first ${pos} taken and now ranks fourth in points among drafted ${pos}s.</p>
       <div class="tbl"><table><thead>${heads(1)}</thead><tbody>${rows.map(p=>pickRow(p,1)).join("")}</tbody></table></div>`;
      bindPicker("drPos",v=>{pos=v;draw()});
    } else {
      const rounds=[...new Set(picks.map(p=>p.round))].sort((a,b)=>a-b);
      const order=picks.filter(p=>p.round==1).sort((a,b)=>a.pick-b.pick).map(p=>p.owner);
      const cell=p=>{if(!p)return'<td class="bd"></td>';
        return `<td class="bd" style="${heat(p.pos_value,-20,20)}" title="${esc(p.player)} — drafted ${p.pos}${p.pos_draft_rank}, now ${p.pos}${p.pos_points_rank} (${p.gp?f2(p.points)+" pts":"no starts"})">
          <b>${esc(p.player)}</b><i>${p.pos} · ${p.gp?f2(p.points):"—"}</i></td>`};
      B.innerHTML=`<p class="lede">Columns are owners in first-round order. The draft snakes, so pick numbers reverse every other round. Green means a pick has gained ground on his position slot; hover any cell for detail.</p>
       <div class="board"><table><thead><tr><th class="l">Rd</th>${order.map(o=>`<th class="l">${esc(o)}</th>`).join("")}</tr></thead><tbody>
       ${rounds.map(r=>`<tr><td class="l rd"><b>${r}</b></td>${order.map(o=>cell(picks.find(x=>x.round==r&&x.owner==o))).join("")}</tr>`).join("")}
       </tbody></table></div>`;
    }
  };
  draw();
  bindPicker("drView",v=>{view=v;document.querySelectorAll("#drView button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==v));draw()});
}

/* ---------------- Rulebook ---------------- */
function rRules(){
  const S=D.standings, reg=D.weekly.filter(w=>!w.playoff), wks=[...new Set(reg.map(w=>w.week))].sort((a,b)=>a-b);
  const highs=wks.map(w=>{const r=reg.filter(x=>x.week==w),m=Math.max(...r.map(x=>x.pf));return{week:w,pf:m,teams:r.filter(x=>x.pf==m).map(x=>x.team)}});
  const won={};highs.forEach(h=>h.teams.forEach(t=>won[t]=(won[t]||0)+30/h.teams.length));
  const mostPF=[...S].sort((a,b)=>b.PF-a.PF)[0], regDone=wks.length>=D.reg_season_weeks;
  const pay=[["Champion (1st place overall)",1290,"Decided in the championship, week 17"],["2nd place overall",500,"Decided in the championship, week 17"],
    ["1st place after regular season",415,`${regDone?"Won by":"Currently"} ${esc(S[0].team)} (${S[0].W}-${S[0].L}-${S[0].T})`],
    ["Most points, regular season",375,`${regDone?"Won by":"Currently"} ${esc(mostPF.team)} (${f2(mostPF.PF)})`],
    ["Weekly high score (14 weeks × $30)",420,`${highs.length} of 14 weeks paid out`]];
  const slot=(n,l,c="")=>Array.from({length:n},()=>`<div class="slot ${c}">${l}</div>`).join("");
  const sc=(rows)=>`<div class="tbl"><table><thead><tr><th class="l">Stat</th><th>Points</th></tr></thead><tbody>${rows.map(([a,b])=>`<tr><td class="l">${a}</td><td><b>${b}</b></td></tr>`).join("")}</tbody></table></div>`;
  $("#p-rules").innerHTML=`<div class="rules"><h2>Rulebook</h2><p class="lede">Official NR Crew rules for the ${D.season}-${D.season+1} season.</p>
  ${picker("rJump",[["r1","Fees & payouts"],["r2","Lineup"],["r3","Keepers"],["r4","Waivers"],["r5","Weekly format"],["r6","Playoffs"],["r7","Scoring"]],"")}

  <div class="rule-sec" id="r1"><h3><span class="n">1</span>League fees and payouts</h3>
   <div class="pool"><div class="kpi"><b>$300</b><span>Fee per team</span></div><div class="kpi"><b>$3,000</b><span>Total prize pool, 10 teams</span></div></div>
   <div class="tbl"><table><thead><tr><th class="l">Payout</th><th>Amount</th><th class="l">Status</th></tr></thead><tbody>
    ${pay.map(p=>`<tr><td class="l team">${p[0]}</td><td><b>$${p[1].toLocaleString()}</b></td><td class="l muted">${p[2]}</td></tr>`).join("")}
    <tr class="pin-bot"><td class="l"><b>Total</b></td><td><b>$3,000</b></td><td></td></tr></tbody></table></div>
   <h4>Weekly high score winners</h4>
   <div class="tbl"><table><thead><tr><th class="l">Week</th><th class="l">Team</th><th>Score</th><th>Payout</th></tr></thead><tbody>
    ${highs.map(x=>`<tr><td class="l">${x.week}</td><td class="l team">${esc(x.teams.join(", "))}</td><td>${f2(x.pf)}</td><td>$${(30/x.teams.length).toFixed(2).replace(".00","")}</td></tr>`).join("")}</tbody></table></div>
   <p class="note">Weekly high score money so far: ${Object.entries(won).sort((a,b)=>b[1]-a[1]).map(([t,v])=>`${esc(t)} $${v%1?v.toFixed(2):v}`).join(", ")}.</p></div>

  <div class="rule-sec" id="r2"><h3><span class="n">2</span>Roster and starting lineup</h3>
   <p>Each team starts 11 players every week:</p>
   <div class="slots">${slot(1,"QB")}${slot(2,"RB")}${slot(3,"WR")}${slot(1,"TE")}${slot(1,"FLEX","flex")}${slot(1,"SFLEX","sf")}${slot(1,"K")}${slot(1,"DEF")}</div>
   <div class="slots">${slot(7,"BN","bench")}${slot(2,"IR","bench")}</div>
   <ul><li><b>Flex:</b> RB, WR, or TE.</li><li><b>SuperFlex:</b> QB, RB, WR, or TE.</li><li><b>Bench:</b> 7 spots. <b>Injured Reserve:</b> 2 spots.</li></ul></div>

  <div class="rule-sec" id="r3"><h3><span class="n">3</span>Keeper rules</h3>
   <h4>Eligibility</h4><ul>
    <li>Each team may keep <b>one player</b> per season.</li>
    <li>All other roster spots go back into the draft pool and are drafted fresh.</li>
    <li>Keepers are a snapshot of your <b>final season roster</b>. Whoever is on your roster at the end of the season is eligible, no matter how they got there.</li></ul>
   <h4>Cost for drafted players</h4><ul>
    <li>A keeper costs a pick <b>3 rounds earlier</b> than the round they were originally drafted.</li>
    <li>It's based on the player's <b>original draft round</b>, no matter who drafted them or whether they were traded to you.</li>
    <li>Each additional consecutive year you keep the same player, the cost moves up <b>3 more rounds</b>.</li>
    <li>A player drafted or kept in <b>rounds 1 to 3</b> can't be kept, because 3 rounds can't be taken off.</li></ul>
   <div class="ladder"><div class="rung"><b>Rd 9</b><span>Originally drafted</span></div><div class="arrow">›</div>
    <div class="rung"><b>Rd 6</b><span>Keeper cost, year 1</span></div><div class="arrow">›</div>
    <div class="rung"><b>Rd 3</b><span>Keeper cost, year 2</span></div><div class="arrow">›</div>
    <div class="rung no"><b>Done</b><span>Can't be kept again</span></div></div>
   <h4>Cost for undrafted and waiver players</h4><ul>
    <li>Players who went undrafted or came off waivers cost a <b>Round 11</b> pick, no matter when they joined your roster.</li></ul></div>

  <div class="rule-sec" id="r4"><h3><span class="n">4</span>Waivers</h3><ul>
   <li>Each team gets a <b>$100 waiver budget</b> for the season.</li>
   <li>The waiver period runs from <b>game time through Tuesday</b>.</li>
   <li>Waiver priority starts in <b>reverse order of the current standings</b> each week and rolls. A successful claim moves your team to the end of the list.</li></ul></div>

  <div class="rule-sec" id="r5"><h3><span class="n">5</span>Weekly scoring format</h3>
   <p>Every regular season week is worth <b>two possible wins</b>:</p><ul>
   <li><b>1 win</b> for beating your head-to-head opponent.</li>
   <li><b>1 win</b> for scoring above the league median that week (the top five scores).</li></ul>
   <p>So each week you can go 2-0, 1-1, or 0-2. A score exactly equal to the median counts as a tie.</p></div>

  <div class="rule-sec" id="r6"><h3><span class="n">6</span>Playoffs and tiebreakers</h3><ul>
   <li><b>Regular season:</b> weeks 1 to ${D.reg_season_weeks}.</li>
   <li><b>Playoffs:</b> weeks ${D.playoff_weeks[0]} to ${D.playoff_weeks[D.playoff_weeks.length-1]}. <b>6 teams</b> qualify and the <b>top 2 seeds get a bye</b>.</li>
   <li>The median game <b>does not apply</b> in the playoffs.</li>
   <li><b>Standings tiebreaker:</b> total points for.</li></ul></div>

  <div class="rule-sec" id="r7"><h3><span class="n">7</span>Scoring</h3><div class="two">
   ${sc([["Passing yards","1 per 25 yds"],["Passing TD","4"],["Interception","-1"],["Rushing yards","1 per 10 yds"],["Rushing TD","6"],["Reception","1"],["Receiving yards","1 per 10 yds"],["Receiving TD","6"],["Return TD","6"],["2-point conversion","2"],["Fumble lost","-2"],["Offensive fumble return TD","6"]])}
   <div>${sc([["FG 0-39 yds","3"],["FG 40-49 yds","4"],["FG 50+ yds","5"],["Missed FG 0-39 yds","-1"],["PAT made","1"]])}</div>
   ${sc([["Sack","1"],["Interception","2"],["Fumble recovery","2"],["Touchdown","6"],["Safety","2"],["Blocked kick","4"],["Kick or punt return TD","6"],["Extra point returned","2"],["0 pts allowed","15"],["1-6 pts allowed","10"],["7-13 pts allowed","5"],["14-20 pts allowed","2"],["21-27 pts allowed","0"],["28-34 pts allowed","-1"],["35+ pts allowed","-5"]])}</div>
   <p class="note">Offense, kicker, and defense/special teams scoring, left to right.</p></div></div>`;
  bindPicker("rJump",id=>document.getElementById(id).scrollIntoView({behavior:"smooth"}));
}

/* ---------------- History ---------------- */
function rHistory(){
  const H=D.history, act=H.alltime.filter(a=>a.active), former=H.alltime.filter(a=>!a.active);
  const cols=[["years","Years"],["games","Games"],["first","1st"],["second","2nd"],["third","3rd"],["top2","Top 2"],["top3","Top 3"],["W","Wins"],["L","Losses"],["T","Ties"],["win_pct","Win %"],["playoffs","Playoffs"],["playoff_pct","Playoff %"]];
  const hs=Object.fromEntries(cols.map(([k])=>[k,colHeat(act,k,k=="L")]));
  const cell=(k,v)=>k.endsWith("pct")?pct(v):num(v);
  const allRow=(a,heatOn)=>`<tr><td class="team l">${esc(a.manager)}</td>${cols.map(([k])=>`<td style="${heatOn?hs[k](a):""}">${cell(k,a[k])}</td>`).join("")}</tr>`;
  const mgrs=act.map(a=>a.manager);
  const R=H.active_ranks, rkCols=cols.filter(c=>c[0]!="T");
  const EV={Original:"#E8A33D",New:"#6AA84F",Returning:"#E8CF73",Departing:"#D46A62",Continuing:"#5B616C"};
  const maxSeats=Math.max(...H.evolution.map(e=>e.seats.length));
  const tenure=[...H.alltime].sort((a,b)=>b.years-a.years);
  $("#p-history").innerHTML=`<h2>League History</h2><p class="lede">${H.years[0]} to ${H.years[H.years.length-1]}. ${H.years.length} seasons, ${H.alltime.length} managers.</p>
   ${picker("hJump",[["h-all","All-time"],["h-rank","Rankings"],["h-champ","Championships"],["h-year","Year by year"],["h-evo","Evolution"],["h-awd","Awards"]],"")}
   <h3 id="h-all">All-time, sorted by win %</h3><div class="tbl"><table><thead><tr><th class="l">Manager</th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
    ${act.map(a=>allRow(a,1)).join("")}</tbody><tbody><tr class="pin-top"><td colspan="${cols.length+1}" class="l muted" style="background:var(--shell2)">Former managers</td></tr>${former.map(a=>allRow(a,0)).join("")}</tbody></table></div>
   <p class="note">Since ${H.median_years[0]||"2024"} the median game counts as half a win, so every era compares on the same 1-game-per-week scale.</p>
   <h3 id="h-rank">Active manager rankings</h3><p class="lede">1 is best in each column. Fewest losses ranks first.</p><div class="tbl"><table><thead><tr><th class="l">Manager</th>${rkCols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
    ${mgrs.map(m=>`<tr><td class="team l">${esc(m)}</td>${rkCols.map(([k])=>`<td style="${heat(R[m][k],1,10,true)}">${R[m][k]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <div class="panel" style="margin-top:18px"><h4>Playoff % vs. win %</h4><div class="chart sm"><canvas id="cPvW"></canvas></div></div>
   <h3 id="h-champ">Championships</h3><div class="grid2"><div class="tbl"><table><thead><tr><th class="l">Year</th><th class="l">Champion</th><th class="l">Runner-up</th><th>Record</th><th>Draft slot</th><th>Teams</th></tr></thead><tbody>
    ${[...H.championships].reverse().map(c=>`<tr><td class="l">${c.year}</td><td class="team l">${esc(c.champion)}</td><td class="l">${esc(c.runner_up)}</td><td>${num(c.W)}-${num(c.L)}-${num(c.T)}</td><td>${c.draft??""}</td><td>${c.size??""}</td></tr>`).join("")}</tbody></table></div>
    <div class="panel"><h4>Titles by draft slot</h4><p class="note" style="margin-top:0">Since the league went to 10 teams.</p><div class="chart sm"><canvas id="cSlot"></canvas></div></div></div>
   <h3 id="h-year">Wins by year</h3><div class="tbl"><table><thead><tr><th class="l">Year</th>${mgrs.map(m=>`<th>${esc(m)}</th>`).join("")}<th class="l">Format</th></tr></thead><tbody>
    ${[...H.years].reverse().map(y=>`<tr><td class="l">${y}</td>${mgrs.map(m=>{const v=H.wins_grid[y][m];return`<td style="${v!=null?heat(v/H.games_by_year[y],0,1):""}">${v!=null?num(v):""}</td>`}).join("")}<td class="l muted">${H.games_by_year[y]}-week season${H.median_years.includes(y)?", median game (½ win)":""}</td></tr>`).join("")}</tbody></table></div>
   <h3>Playoff appearances</h3><div class="tbl"><table><thead><tr><th class="l">Year</th>${mgrs.map(m=>`<th>${esc(m)}</th>`).join("")}</tr></thead><tbody>
    ${[...H.years].reverse().map(y=>`<tr><td class="l">${y}</td>${mgrs.map(m=>{const v=H.playoff_grid[y][m];return v==null?"<td></td>":`<td style="text-align:center;${v?"background:rgba(47,138,92,.35)":""}">${v?"✓":"<span class='muted'>·</span>"}</td>`}).join("")}</tr>`).join("")}
    <tr class="pin-bot"><td class="l"><b>Total</b></td>${mgrs.map(m=>`<td style="text-align:center"><b>${num(act.find(a=>a.manager==m).playoffs)}</b></td>`).join("")}</tr></tbody></table></div>
   <h3 id="h-evo">League evolution</h3><div class="legend">${["Original","New","Returning","Departing"].map(k=>`<span><i style="background:${EV[k]}"></i>${k}</span>`).join("")}</div>
    <div class="tbl"><table><thead><tr><th class="l">Year</th>${Array.from({length:maxSeats},(_,i)=>`<th style="text-align:center">${i+1}</th>`).join("")}</tr></thead><tbody>
    ${[...H.evolution].reverse().map(e=>`<tr><td class="l">${e.year}</td>${Array.from({length:maxSeats},(_,i)=>{const s=e.seats[i];return s?`<td class="seat" style="background:${EV[s.type]||EV.Continuing}">${esc(s.manager)}</td>`:"<td></td>"}).join("")}</tr>`).join("")}</tbody></table></div>
   <div class="panel" style="margin-top:18px"><h4>Seasons in the league</h4><div class="chart"><canvas id="cTen"></canvas></div></div>
   <h3 id="h-awd">Records and awards</h3><div class="tbl"><table><thead><tr><th class="l">Award</th><th>Stat</th><th class="l">Manager</th><th class="l">Year</th></tr></thead><tbody>
    ${H.awards.map(a=>`<tr><td class="l">${esc(a.award)}</td><td><b>${/pct|Win %/.test(a.award)?pct(a.stat):num(a.stat)}</b></td><td class="team l">${esc(a.managers.join(", "))}</td><td class="l muted">${esc(a.years.join(", "))}</td></tr>`).join("")}</tbody></table></div>`;
  bindPicker("hJump",id=>document.getElementById(id).scrollIntoView({behavior:"smooth"}));
  mkChart("cPvW",{type:"bar",data:{labels:mgrs,datasets:[{label:"Win %",data:act.map(a=>a.win_pct),backgroundColor:"#3A3F49"},{label:"Playoff %",data:act.map(a=>a.playoff_pct),backgroundColor:"#E3121B"}]},
    options:baseOpts({scales:{x:{ticks:{color:"#14161A"},grid:{display:false}},y:{min:0,max:1,ticks:{color:"#4A505B",callback:v=>pct(v)},grid:{color:"#C9CDD3"}}}})});
  const slots=Array.from({length:10},(_,i)=>i+1);
  mkChart("cSlot",{type:"bar",data:{labels:slots.map(s=>"#"+s),datasets:[{label:"Titles",data:slots.map(s=>H.titles_by_draft_slot[s]||0),backgroundColor:"#E3121B"}]},
    options:baseOpts({plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#14161A"},grid:{display:false}},y:{ticks:{color:"#4A505B",stepSize:1},grid:{color:"#C9CDD3"}}}})});
  mkChart("cTen",{type:"bar",data:{labels:tenure.map(a=>a.manager),datasets:[{label:"Seasons",data:tenure.map(a=>a.years),backgroundColor:tenure.map(a=>a.active?"#3A3F49":"#A3A9B3")}]},
    options:baseOpts({indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#4A505B"},grid:{color:"#C9CDD3"}},y:{ticks:{color:"#14161A"},grid:{display:false}}}})});
}
</script>
</body>
</html>
